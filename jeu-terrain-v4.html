<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission sécurité – Terrain</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;font-family:Arial,Helvetica,sans-serif;background:#f4f6fa;color:#16181d}
.card{background:#fff;border-radius:12px;padding:14px;margin:0 auto 12px auto;max-width:620px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
h1{color:#004aad;font-size:1.3rem;margin:6px 0 8px 0;text-align:center}
.btn{display:block;width:100%;padding:13px;margin:8px 0 0 0;border:0;border-radius:8px;background:#004aad;color:#fff;font-size:1rem;font-weight:700;cursor:pointer}
.btn.sec{background:#fff;color:#004aad;border:2px solid #004aad}
.services{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.services .btn{margin:0;font-size:.95rem}
svg{width:100%;height:auto;display:block;border-radius:8px;touch-action:manipulation}
.bulle{background:#fff8d6;border:2px solid #ffcc00;border-radius:10px;padding:10px;margin-top:10px;font-size:.95rem;min-height:56px}
.compteur{text-align:center;font-weight:700;margin:8px 0 0 0;color:#004aad}
.dpad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:220px;margin:10px auto 0 auto}
.dpad button{padding:14px 0;border:0;border-radius:8px;background:#004aad;color:#fff;font-size:1.3rem;cursor:pointer}
.dpad .vide{visibility:hidden}
.opt{text-align:left;background:#eef0f2;color:#16181d;border:2px solid #d3d7dc;font-weight:600;margin-top:8px}
.ok{background:#2e7d32!important;color:#fff!important;border-color:#2e7d32!important}
.ko{background:#c8102e!important;color:#fff!important;border-color:#c8102e!important}
.explic{margin-top:10px;padding:10px;border-left:4px solid #004aad;background:#eef0f2;border-radius:6px;font-size:.95rem}
</style>
</head>
<body>
<a href="index.html" style="display:block; max-width:620px; margin:0 auto 12px auto; padding:12px; background:#004aad; color:#fff; border-radius:8px; text-align:center; font-weight:700; text-decoration:none;">⬅️ Retour à l'espace salarié</a>

<div id="ecran-services" class="card">
  <h1>🎯 Mission sécurité : sur le terrain</h1>
  <p style="text-align:center;font-size:.92rem">Choisis ton service. Tu te déplaces dans la scène, tu repères ce qui peut être mieux, puis tu réponds à une petite question. Pas de chrono, pas de pression : on apprend en s'amusant.</p>
  <div id="liste-services" class="services"></div>
</div>

<div id="ecran-scene" class="card" hidden>
  <h1 id="titre-scene"></h1>
  <svg id="scene" viewBox="0 0 360 240" onclick="allerDepuisClic(event)"></svg>
  <p class="compteur" id="compteur"></p>
  <div class="bulle" id="bulle"></div>
  <div class="dpad">
    <span class="vide"></span><button onclick="bouger(0,-10)" aria-label="Haut">▲</button><span class="vide"></span>
    <button onclick="bouger(-10,0)" aria-label="Gauche">◀</button><span class="vide"></span><button onclick="bouger(10,0)" aria-label="Droite">▶</button>
    <span class="vide"></span><button onclick="bouger(0,10)" aria-label="Bas">▼</button><span class="vide"></span>
  </div>
  <button class="btn sec" onclick="indice()">💡 Besoin d'un indice ?</button>
  <button class="btn" onclick="finirRecherche()">✋ J'ai fini de chercher</button>
  <button class="btn sec" onclick="afficherServices()">⬅️ Changer de service</button>
</div>

<div id="ecran-decision" class="card" hidden>
  <h1>🤔 Question de décision</h1>
  <div id="decision-q"></div>
  <div id="decision-choix"></div>
  <div id="decision-explic"></div>
  <button id="btn-autre" class="btn" onclick="autreScene()" hidden>🔄 Une autre scène de ce service</button>
  <button id="btn-suite" class="btn sec" onclick="afficherServices()" hidden>Choisir un autre service</button>
</div>

<script>
// ==================== SERVICES ====================
const SERVICES = [
  { id: "reception", nom: "Réception", emoji: "📦" },
  { id: "preparateur", nom: "Préparateur", emoji: "🛒" },
  { id: "chargeur", nom: "Chargeur", emoji: "🚚" },
  { id: "cariste", nom: "Cariste", emoji: "🚜" },
  { id: "maintenance", nom: "Maintenance", emoji: "🔧" },
  { id: "chef", nom: "Chef d'équipe", emoji: "🧑‍💼" },
  { id: "cadre", nom: "Cadre", emoji: "📋" }
];

// ==================== DÉCORS ====================
const DECOR = {
  quai: () => `<rect width="360" height="240" fill="#e4e8ee"/>
<rect width="360" height="90" fill="#c3cad3"/>
<rect x="230" y="18" width="110" height="62" fill="#8d99a6" stroke="#4a5563" stroke-width="2"/>
<text x="285" y="54" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">QUAI 3</text>
<rect y="200" width="360" height="40" fill="#cfd5dd"/>
<line x1="0" y1="200" x2="360" y2="200" stroke="#f5c400" stroke-width="3"/>`,
  allee: () => `<rect width="360" height="240" fill="#e4e8ee"/>
<rect width="360" height="22" fill="#b5bec9"/>
<rect y="200" width="360" height="40" fill="#cfd5dd"/>
<line x1="0" y1="150" x2="360" y2="150" stroke="#f5c400" stroke-width="3" stroke-dasharray="14 8"/>
<line x1="0" y1="190" x2="360" y2="190" stroke="#2a78d6" stroke-width="3" stroke-dasharray="10 6"/>`,
  rayon: () => `<rect width="360" height="240" fill="#e4e8ee"/>
<rect x="20" y="40" width="320" height="6" fill="#4a5563"/>
<rect x="20" y="100" width="320" height="6" fill="#4a5563"/>
<rect x="20" y="160" width="320" height="6" fill="#4a5563"/>
<rect x="26" y="20" width="6" height="190" fill="#4a5563"/>
<rect x="328" y="20" width="6" height="190" fill="#4a5563"/>
<rect y="200" width="360" height="40" fill="#cfd5dd"/>`,
  bureau: () => `<rect width="360" height="240" fill="#eef1f5"/>
<rect width="360" height="90" fill="#dfe5ec"/>
<rect x="20" y="150" width="150" height="10" fill="#8a6a3f"/>
<rect x="240" y="150" width="100" height="10" fill="#8a6a3f"/>
<rect y="200" width="360" height="40" fill="#d6dce4"/>`
};

// ==================== OBJETS (dessinés à leur position) ====================
const OBJ = {
  flaque: (x, y, c) => `<ellipse cx="${x}" cy="${y}" rx="42" ry="12" fill="${c || '#7fb3e0'}" opacity=".85"/><ellipse cx="${x - 10}" cy="${y - 3}" rx="12" ry="3" fill="#fff" opacity=".6"/>`,
  cone: (x, y) => `<polygon points="${x - 9},${y} ${x + 9},${y} ${x},${y - 26}" fill="#ff7a1a" stroke="#333" stroke-width=".5"/><rect x="${x - 6}" y="${y - 14}" width="12" height="4" fill="#fff"/><rect x="${x - 12}" y="${y}" width="24" height="4" fill="#333"/>`,
  chariot: (x, y) => `<g transform="translate(${x},${y})"><rect x="-26" y="-22" width="40" height="30" rx="4" fill="#1f5fa8" stroke="#333"/><rect x="-22" y="-44" width="30" height="4" fill="#333"/><rect x="-24" y="-46" width="3" height="28" fill="#555"/><rect x="2" y="-18" width="26" height="20" rx="3" fill="#f5a300" stroke="#333"/><rect x="14" y="0" width="22" height="3" fill="#333"/><rect x="28" y="-2" width="4" height="10" fill="#333"/><circle cx="-18" cy="10" r="6" fill="#222"/><circle cx="12" cy="10" r="6" fill="#222"/></g>`,
  transpalette: (x, y) => `<g transform="translate(${x},${y})"><rect x="-30" y="-6" width="40" height="8" fill="#555"/><line x1="10" y1="-4" x2="28" y2="-40" stroke="#333" stroke-width="3"/><rect x="-22" y="-20" width="30" height="14" fill="#d9b87c"/></g>`,
  palette: (x, y) => `<g transform="translate(${x},${y})"><rect x="-30" y="-6" width="60" height="6" fill="#8a6a3f"/><rect x="-28" y="-24" width="24" height="18" fill="#d9b87c" stroke="#8a6a3f"/><rect x="-2" y="-24" width="24" height="18" fill="#e8c98f" stroke="#8a6a3f"/><rect x="-28" y="-40" width="54" height="16" fill="#e8c98f" stroke="#8a6a3f"/></g>`,
  caisses: (x, y) => `<g transform="translate(${x},${y})"><rect x="-22" y="-20" width="44" height="20" fill="#d9b87c" stroke="#8a6a3f"/><rect x="-18" y="-36" width="36" height="16" fill="#e8c98f" stroke="#8a6a3f"/></g>`,
  escabeau: (x, y) => `<g transform="translate(${x},${y})"><polygon points="-22,0 0,-50 22,0" fill="none" stroke="#f5c400" stroke-width="4"/><line x1="-11" y1="-25" x2="11" y2="-25" stroke="#333" stroke-width="3"/><line x1="-15" y1="-12" x2="15" y2="-12" stroke="#333" stroke-width="3"/></g>`,
  cutter: (x, y) => `<g transform="translate(${x},${y})"><rect x="-14" y="-4" width="26" height="8" rx="2" fill="#d33"/><polygon points="12,-4 22,0 12,4" fill="#bbb"/></g>`,
  trousse: (x, y) => `<g transform="translate(${x},${y})"><rect x="-20" y="-16" width="40" height="16" rx="3" fill="#c8102e" stroke="#333"/><rect x="-6" y="-20" width="12" height="5" fill="#333"/></g>`,
  cable: (x, y) => `<path d="M${x - 40} ${y} Q${x} ${y + 8} ${x + 40} ${y}" fill="none" stroke="#222" stroke-width="4"/>`,
  extincteur: (x, y) => `<g transform="translate(${x},${y})"><rect x="-8" y="-40" width="16" height="40" rx="6" fill="#c8102e" stroke="#333"/><rect x="-4" y="-46" width="8" height="6" fill="#333"/></g>`,
  porte: (x, y) => `<g transform="translate(${x},${y})"><rect x="-22" y="-60" width="44" height="60" fill="#9aa6b2" stroke="#4a5563" stroke-width="2"/><rect x="-14" y="-40" width="28" height="6" fill="#c8102e"/></g>`,
  cale: (x, y) => `<polygon points="${x - 16},${y} ${x + 16},${y} ${x + 16},${y - 8}" fill="#b07a3c" stroke="#6b4a22"/>`,
  sortie: (x, y) => `<rect x="${x - 30}" y="${y - 18}" width="60" height="24" fill="#2e7d32"/><text x="${x}" y="${y - 2}" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">SORTIE</text>`,
  camion: (x, y) => `<g transform="translate(${x},${y})"><rect x="-70" y="-70" width="140" height="90" rx="4" fill="#f4f6f8" stroke="#555" stroke-width="2"/><rect x="-70" y="-10" width="140" height="8" fill="#004aad"/><circle cx="-40" cy="22" r="10" fill="#222"/><circle cx="40" cy="22" r="10" fill="#222"/></g>`,
  rampe: (x, y) => `<polygon points="${x - 50},${y} ${x + 10},${y - 30} ${x + 10},${y}" fill="#b8bec6" stroke="#666"/>`,
  sangle: (x, y) => `<line x1="${x - 30}" y1="${y - 10}" x2="${x + 30}" y2="${y + 10}" stroke="#f5c400" stroke-width="4" stroke-dasharray="6 3"/>`,
  dechets: (x, y) => `<g transform="translate(${x},${y})"><ellipse cx="0" cy="-8" rx="14" ry="10" fill="#333"/><ellipse cx="18" cy="-4" rx="8" ry="6" fill="#555"/></g>`,
  bord: (x, y) => `<rect x="${x - 50}" y="${y}" width="100" height="8" fill="#f5c400" stroke="#333" stroke-width=".5"/>`,
  passage: (x, y) => `<rect x="${x - 30}" y="${y - 40}" width="60" height="80" fill="#fff" opacity=".9"/><text x="${x}" y="${y - 46}" text-anchor="middle" font-size="9" font-weight="700" fill="#2a78d6">PASSAGE PIÉTON</text>`,
  escalier: (x, y) => `<g transform="translate(${x},${y})"><polygon points="-40,0 40,0 40,-50 30,-50 30,-30 20,-30 20,-10 10,-10 10,-40 0,-40 0,-20 -10,-20 -10,0" fill="#9aa6b2" stroke="#4a5563"/></g>`,
  armoire: (x, y) => `<g transform="translate(${x},${y})"><rect x="-30" y="-70" width="60" height="70" fill="#c9d0d8" stroke="#4a5563" stroke-width="2"/><rect x="-26" y="-66" width="20" height="62" fill="#f4f6f8" transform="rotate(-18 -26 -66)"/><polygon points="6,-50 0,-30 8,-30 4,-14 14,-36 6,-36" fill="#c8102e"/></g>`,
  multiprise: (x, y) => `<g transform="translate(${x},${y})"><rect x="-30" y="-16" width="60" height="16" rx="3" fill="#222"/><rect x="-24" y="-30" width="48" height="14" rx="3" fill="#333"/><rect x="-18" y="-42" width="36" height="12" rx="3" fill="#444"/><circle cx="-14" cy="-8" r="2" fill="#777"/><circle cx="0" cy="-8" r="2" fill="#777"/><circle cx="14" cy="-8" r="2" fill="#777"/></g>`,
  echelle: (x, y) => `<g transform="translate(${x},${y})"><line x1="-16" y1="0" x2="-16" y2="-70" stroke="#8a6a3f" stroke-width="4"/><line x1="16" y1="0" x2="16" y2="-70" stroke="#8a6a3f" stroke-width="4"/><line x1="-16" y1="-14" x2="16" y2="-14" stroke="#8a6a3f" stroke-width="3"/><line x1="-16" y1="-30" x2="16" y2="-30" stroke="#8a6a3f" stroke-width="3"/><line x1="-16" y1="-46" x2="16" y2="-46" stroke="#8a6a3f" stroke-width="3"/></g>`,
  bouteille: (x, y) => `<g transform="translate(${x},${y})"><rect x="-10" y="-40" width="20" height="40" rx="5" fill="#e8892b" stroke="#333"/><rect x="-5" y="-46" width="10" height="7" fill="#777"/></g>`,
  bidon: (x, y) => `<g transform="translate(${x},${y})"><rect x="-14" y="-34" width="28" height="34" rx="4" fill="#4a8fd6" stroke="#333"/><rect x="-8" y="-22" width="16" height="10" fill="#fff"/></g>`,
  rayon_def: (x, y) => `<polyline points="${x},${y} ${x + 4},${y - 60} ${x - 6},${y - 110}" fill="none" stroke="#c8102e" stroke-width="5"/><rect x="${x - 6}" y="${y - 20}" width="60" height="4" fill="#4a5563"/>`,
  personne: null
};

// ==================== PERSONNAGES ====================
function perso(x, y, o){
  o = o || {};
  return '<g transform="translate(' + x + ',' + y + ')">' +
    (o.joueur ? '<circle cx="0" cy="-8" r="22" fill="none" stroke="#004aad" stroke-width="2" stroke-dasharray="4 3"/>' : '') +
    '<circle cx="0" cy="-26" r="8" fill="#f0c08a"/>' +
    (o.casque ? '<path d="M-9 -29 Q0 -40 9 -29 Z" fill="#ffcc00" stroke="#333" stroke-width=".5"/>' : '') +
    (o.chef ? '<rect x="-7" y="-37" width="14" height="4" fill="#333"/>' : '') +
    '<rect x="-9" y="-18" width="18" height="26" rx="4" fill="' + (o.couleur || '#2a78d6') + '" stroke="#333" stroke-width=".5"/>' +
    (o.gilet ? '<rect x="-9" y="-16" width="18" height="10" fill="#d4ff00" stroke="#333" stroke-width=".5"/>' : '') +
    (o.telephone ? '<rect x="8" y="-14" width="6" height="10" rx="1" fill="#222"/>' : '') +
    (o.ecouteurs ? '<path d="M-10 -28 Q0 -40 10 -28" fill="none" stroke="#222" stroke-width="2"/>' : '') +
    '<rect x="-7" y="8" width="6" height="14" fill="#333"/><rect x="1" y="8" width="6" height="14" fill="#333"/>' +
    '</g>';
}
function dessinerObjet(d){
  if(d.type === "perso") return perso(d.x, d.y, d.o);
  return OBJ[d.type](d.x, d.y, d.c);
}

// ==================== SCÈNES ====================
// Champs : titre, bg (décor), depart, extra (éléments fixes), dangers (à repérer), pnj (personnages), decision
const SCENES = {

  // ---------- RÉCEPTION ----------
  reception: [
    {
      titre: "Réception : le camion arrive", bg: "quai", depart: { x: 40, y: 200 },
      extra: [{ type: "passage", x: 170, y: 150 }],
      dangers: [
        { type: "perso", x: 110, y: 150, o: { couleur: "#f7a600" }, nom: "Chauffeur sans gilet haute visibilité", regle: "Dans la zone de déchargement, tout le monde porte un gilet haute visibilité.", risque: "Être invisible pour un conducteur d'engin." },
        { type: "palette", x: 240, y: 112, nom: "Palettes posées sur le passage piéton", regle: "Un passage piéton reste dégagé en permanence.", risque: "Obliger à marcher dans la zone des engins." },
        { type: "bord", x: 280, y: 96, nom: "Bord de quai sans protection", regle: "Un bord de quai ouvert est protégé ou balisé.", risque: "Chute de hauteur." },
        { type: "perso", x: 260, y: 180, o: { couleur: "#d46a9f" }, nom: "Traversée hors des rayures", regle: "On ne traverse la zone des engins que sur les rayures blanches du passage piéton.", risque: "Collision avec un chariot ou un camion en manœuvre." }
      ],
      pnj: [
        { x: 150, y: 140, nom: "Le réceptionnaire", couleur: "#2a78d6", lignes: "Le camion est là, le bon de livraison est prêt. Il ne reste plus qu'à décharger en sécurité !" },
        { x: 320, y: 150, nom: "Le chef d'équipe", couleur: "#cfd6de", chef: true, lignes: "On est pressés, je sais. Mais personne ne rentre plus vite que quand il rentre entier le soir." }
      ],
      decision: { q: "Un chauffeur n'a pas de gilet et veut décharger tout de suite. Que fais-tu ?", a: ["Je le laisse décharger, il connaît le quai", "Je lui demande de mettre un gilet, et je ne lance pas le déchargement sans lui", "Je lui dis que ce n'est pas grave"], c: 1, e: "Le gilet protège avant tout. Pas de déchargement tant que le chauffeur n'est pas équipé." }
    },
    {
      titre: "Réception : le transpalette oublié", bg: "quai", depart: { x: 40, y: 190 },
      extra: [],
      dangers: [
        { type: "transpalette", x: 135, y: 160, nom: "Transpalette laissé en travers du couloir", regle: "Un engin à l'arrêt est rangé à son emplacement, jamais au milieu d'un passage.", risque: "Heurt ou chute en contournant l'engin." },
        { type: "perso", x: 220, y: 180, o: { telephone: true, couleur: "#2a78d6" }, nom: "Marche en regardant son téléphone", regle: "Le téléphone se range avant de bouger, surtout près des engins.", risque: "Ne pas voir un engin qui arrive." },
        { type: "caisses", x: 300, y: 110, nom: "Cartons empilés trop haut", regle: "Une pile se range plus bas, les cartons lourds au niveau des hanches.", risque: "Chute de cartons sur une personne." }
      ],
      pnj: [
        { x: 80, y: 150, nom: "La réceptionnaire", couleur: "#d46a9f", lignes: "Je cherche mon transpalette depuis dix minutes, il était juste là ! Il est peut-être parti en vacances." },
        { x: 320, y: 200, nom: "Le cadre logistique", couleur: "#3b4a5a", chef: true, lignes: "Un bon rangement, c'est comme une bonne playlist : tout est à sa place, et personne ne se perd." }
      ],
      decision: { q: "Un collègue sur son téléphone passe près d'un transpalette laissé en travers. Que fais-tu ?", a: ["Je rigole avec lui, il trouvera la route", "Je le préviens gentiment et on range le transpalette ensemble", "Je passe à côté sans rien dire"], c: 1, e: "On range l'engin à sa place et on prévient gentiment. Un rappel entre collègues évite bien des accidents." }
    },
    {
      titre: "Réception : l'étagère du haut", bg: "rayon", depart: { x: 300, y: 205 },
      extra: [],
      dangers: [
        { type: "escabeau", x: 285, y: 180, nom: "Escabeau bancal", regle: "Un escabeau se pose sur un sol plat, se déplie complètement, et ne se monte jamais à deux.", risque: "Chute de hauteur." },
        { type: "caisses", x: 150, y: 150, nom: "Caisse trop lourde à bout de bras", regle: "Une charge lourde se pose au sol puis se soulève avec les jambes, dos droit.", risque: "Lombalgie, faux mouvement." },
        { type: "caisses", x: 220, y: 205, nom: "Cartons vides au sol", regle: "Les cartons vides se rangent au fur et à mesure.", risque: "Trébuchement." }
      ],
      pnj: [
        { x: 130, y: 115, nom: "Le collègue réceptionnaire", couleur: "#2a78d6", lignes: "Ce carton là-haut a l'air plus haut que moi. Je tente... ou on demande de l'aide ?" },
        { x: 60, y: 140, nom: "Le chef d'équipe", couleur: "#cfd6de", chef: true, lignes: "Un escabeau, ça ne tient pas une fête de famille. Demander de l'aide, c'est un réflexe de pro." }
      ],
      decision: { q: "Le carton est tout en haut et le seul escabeau est bancal. Que fais-tu ?", a: ["Je monte dessus, ça ira", "Je demande un escabeau stable ou un engin", "Je grimpe sur une caisse"], c: 1, e: "Un escabeau bancal ne se monte pas. On demande un moyen stable, jamais une caisse ou une palette." }
    },
    {
      titre: "Réception : la porte coupe-feu", bg: "quai", depart: { x: 200, y: 200 },
      extra: [{ type: "porte", x: 60, y: 190 }, { type: "sortie", x: 300, y: 120 }],
      dangers: [
        { type: "cale", x: 60, y: 192, nom: "Porte coupe-feu calée ouverte", regle: "Une porte coupe-feu se ferme toute seule. On ne la cale jamais.", risque: "Le feu et la fumée se propagent dans tout le bâtiment." },
        { type: "caisses", x: 290, y: 175, nom: "Sortie de secours encombrée", regle: "Les sorties de secours restent dégagées en permanence.", risque: "Évacuation bloquée en cas d'urgence." },
        { type: "chariot", x: 170, y: 160, nom: "Chariot garé sur l'allée", regle: "Un engin se stationne sur son emplacement, jamais sur une allée.", risque: "Passage bloqué, collision." }
      ],
      pnj: [
        { x: 130, y: 130, nom: "La réceptionnaire", couleur: "#d46a9f", lignes: "Cette porte fait courant d'air, c'est pratique ! Enfin... pour le courant d'air seulement." },
        { x: 330, y: 100, nom: "Le chef d'équipe", couleur: "#cfd6de", chef: true, lignes: "Ouvrir une porte pour l'air, c'est bien. Une porte qui protège tout le monde, c'est mieux." }

// ==================== ÉTAT ====================
let etat = { service: null, idx: 0, scene: null, perso: { x: 0, y: 0 }, trouves: [], dit: {}, anim: null, indice: null };
const $ = id => document.getElementById(id);
function dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }

// ==================== ÉCRANS ====================
function montrer(id){
  ["ecran-services", "ecran-scene", "ecran-decision"].forEach(e => { $(e).hidden = (e !== id); });
}
function afficherServices(){
  clearInterval(etat.anim);
  montrer("ecran-services");
  $("liste-services").innerHTML = SERVICES.map(s =>
    '<button class="btn sec" onclick="choisirService(\'' + s.id + '\')">' + s.emoji + ' ' + s.nom + '</button>'
  ).join("");
}
function choisirService(id){
  etat.service = id;
  lancerScene(Math.floor(Math.random() * SCENES[id].length));
}
function lancerScene(i){
  clearInterval(etat.anim);
  const s = SCENES[etat.service][i];
  etat.idx = i;
  etat.scene = s;
  etat.perso = { x: s.depart.x, y: s.depart.y };
  etat.trouves = []; etat.dit = {}; etat.indice = null; etat.anim = null;
  $("titre-scene").textContent = s.titre;
  $("bulle").innerHTML = "Déplace-toi avec les flèches, ou touche la scène. Repère ce qui pourrait être mieux, et écoute les collègues.";
  montrer("ecran-scene");
  rendre();
}
function autreScene(){
  const n = SCENES[etat.service].length;
  let i;
  do { i = Math.floor(Math.random() * n); } while(n > 1 && i === etat.idx);
  lancerScene(i);
}

// ==================== DÉPLACEMENT ====================
function limiter(p){
  p.x = Math.max(20, Math.min(340, p.x));
  p.y = Math.max(95, Math.min(225, p.y));
}
function bouger(dx, dy){
  clearInterval(etat.anim);
  etat.perso.x += dx; etat.perso.y += dy;
  limiter(etat.perso);
  verifier(); rendre();
}
function allerDepuisClic(evt){
  if(!etat.scene) return;
  const svg = $("scene");
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  const cible = { x: p.x, y: p.y };
  limiter(cible);
  clearInterval(etat.anim);
  etat.anim = setInterval(() => {
    const dx = cible.x - etat.perso.x, dy = cible.y - etat.perso.y;
    const d = Math.hypot(dx, dy);
    if(d < 4){ clearInterval(etat.anim); return; }
    const pas = Math.min(6, d);
    etat.perso.x += dx / d * pas;
    etat.perso.y += dy / d * pas;
    verifier(); rendre();
  }, 40);
}
document.addEventListener("keydown", e => {
  if($("ecran-scene").hidden) return;
  const t = { ArrowUp: [0, -10], ArrowDown: [0, 10], ArrowLeft: [-10, 0], ArrowRight: [10, 0] }[e.key];
  if(t){ e.preventDefault(); bouger(t[0], t[1]); }
});

// ==================== RÉACTIONS ====================
function verifier(){
  const s = etat.scene;
  s.dangers.forEach(d => {
    if(etat.trouves.indexOf(d.nom) === -1 && dist(etat.perso, d) < 40){
      etat.trouves.push(d.nom);
      if(etat.indice === d.nom) etat.indice = null;
      $("bulle").innerHTML = "<strong>✅ " + d.nom + "</strong><br>" + d.regle + "<br><em>Risque : " + d.risque + "</em>";
      if(etat.trouves.length === s.dangers.length){
        $("bulle").innerHTML += "<br><br>🎉 Bravo, tout est repéré ! Touche « J'ai fini de chercher » pour la petite question.";
      }
    }
  });
  s.pnj.forEach(p => {
    if(!etat.dit[p.nom] && dist(etat.perso, p) < 45){
      etat.dit[p.nom] = true;
      $("bulle").innerHTML = "<strong>" + p.nom + " :</strong> « " + p.lignes + " »";
    }
  });
}

// ==================== INDICE ====================
function indice(){
  const s = etat.scene;
  const reste = s.dangers.filter(d => etat.trouves.indexOf(d.nom) === -1);
  if(!reste.length){
    $("bulle").innerHTML = "🎉 Il n'y a plus rien à chercher. Tu peux répondre à la question !";
    return;
  }
  const d = reste[0];
  const dx = d.x - etat.perso.x, dy = d.y - etat.perso.y;
  let dir;
  if(Math.abs(dx) > Math.abs(dy)) dir = dx > 0 ? "plus à droite" : "plus à gauche";
  else dir = dy > 0 ? "plus bas" : "plus haut";
  etat.indice = d.nom;
  $("bulle").innerHTML = "💡 <strong>Indice :</strong> une zone à repérer est " + dir + ". Tu y es presque !";
  rendre();
  setTimeout(() => { if(etat.indice === d.nom){ etat.indice = null; rendre(); } }, 4000);
}

// ==================== DESSIN ====================
function rendre(){
  const s = etat.scene;
  const decor = DECOR[s.bg]();
  const extra = (s.extra || []).map(o => OBJ[o.type](o.x, o.y)).join("");
  const dangers = s.dangers.map(dessinerObjet).join("");
  const marques = s.dangers.map(d => {
    if(etat.trouves.indexOf(d.nom) !== -1){
      return '<g transform="translate(' + (d.x + 16) + ',' + (d.y - 30) + ')"><circle r="11" fill="#2e7d32"/><text y="5" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">✓</text></g>';
    }
    if(etat.indice === d.nom){
      return '<circle cx="' + d.x + '" cy="' + (d.y - 10) + '" r="30" fill="none" stroke="#ffcc00" stroke-width="4" stroke-dasharray="6 4"/>';
    }
    return '';
  }).join("");
  const gens = s.pnj.map(p => perso(p.x, p.y, { couleur: p.couleur, chef: p.chef })).join("");
  $("scene").innerHTML = decor + extra + dangers + marques + gens + perso(etat.perso.x, etat.perso.y, { couleur: "#f7a600", joueur: true });
  $("compteur").textContent = etat.trouves.length + " / " + s.dangers.length + " repérés";
}

// ==================== FIN DE RECHERCHE ====================
function finirRecherche(){
  clearInterval(etat.anim);
  const s = etat.scene, d = s.decision;
  const melange = d.a.map((t, i) => ({ t: t, ok: i === d.c })).sort(() => Math.random() - 0.5);
  const oublies = s.dangers.filter(x => etat.trouves.indexOf(x.nom) === -1);
  let intro;
  if(oublies.length){
    intro = "<p><strong>👀 Zones que tu n'as pas encore repérées :</strong></p>" +
      oublies.map(x => "<p><strong>" + x.nom + "</strong> : " + x.regle + "</p>").join("");
  } else {
    intro = "<p><strong>🎉 Tu as tout repéré dans cette scène !</strong></p>";
  }
  $("decision-q").innerHTML = intro + '<p style="font-weight:700">🤔 ' + d.q + '</p>';
  $("decision-explic").innerHTML = "";
  $("btn-autre").hidden = true;
  $("btn-suite").hidden = true;
  $("decision-choix").innerHTML = melange.map(o =>
    '<button class="btn opt" onclick="choisirReponse(' + o.ok + ', this)">' + o.t + '</button>'
  ).join("");
  montrer("ecran-decision");
}
function choisirReponse(ok, btn){
  document.querySelectorAll("#decision-choix button").forEach(b => { b.disabled = true; });
  btn.classList.add(ok ? "ok" : "ko");
  const d = etat.scene.decision;
  $("decision-explic").innerHTML = '<div class="explic"><strong>' + (ok ? "✅ Bonne décision !" : "🙂 Pas tout à fait, et ce n'est pas grave.") + "</strong> " + d.e + "</div>";
  $("btn-autre").hidden = false;
  $("btn-suite").hidden = false;
}
